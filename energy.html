<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Cards</title>
<style>
  body {
    font-family: monospace;
    background: #eb0c0c;   /* matches the printer's own GB-green palette */
    color: #faf7f7;
    margin: 0;
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    margin: 0 0 6px;
  }
  p.sub {
    text-align: center;
    max-width: 560px;
    margin: 0 auto 28px;
    line-height: 1.5;
  }
  #status {
    text-align: center;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: #eb0c0c;
    border: 2px solid #700b03;
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card img {
    width: 100%;
    max-width: 128px;
    image-rendering: pixelated;
    background: #fff;
    border: 1px solid #700b03;
    margin-bottom: 8px;
  }
  .card .name {
    font-size: 11px;
    word-break: break-all;
    margin-bottom: 8px;
    flex-grow: 1;
  }
  .card a.download {
    display: inline-block;
    font-size: 12px;
    padding: 6px 10px;
    background: #700b03;
    color: #faf7f7;
    text-decoration: none;
    border-radius: 4px;
  }
  .card a.download:hover {
    opacity: 0.85;
  }
  a.back {
    display: block;
    text-align: center;
    margin-top: 32px;
    color: #faf7f7;
  }
  .card img { cursor: zoom-in; }

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 56, 15, 0.9);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  image-rendering: pixelated;
  border: 3px solid #eb0c0c;
}
</style>
</head>
<body>

  <h1>Energy Cards</h1>
  <p class="sub">
    Energy cards from Gameboy Pokemon TCG.
  </p>

  <div id="status">Loading frames&hellip;</div>
  <div id="grid" class="grid"></div>
  <div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

  <a class="back" href="index.html">&larr; Back to the index</a>

<script>
  // ------------------------------------------------------------------
  // Set this to "your-github-username/your-repo-name" — the repo that
  // has a "frames" folder at its root (or update FRAMES_PATH below if
  // it lives somewhere else in the repo).
  // ------------------------------------------------------------------
  var REPO = "nilltronic/pokemontcg";
  var FRAMES_PATH = "energy";

  var statusEl = document.getElementById('status');
  var gridEl = document.getElementById('grid');

  fetch('https://api.github.com/repos/' + REPO + '/contents/' + FRAMES_PATH)
    .then(function(res) {
      if (!res.ok) throw new Error('GitHub API returned ' + res.status);
      return res.json();
    })
    .then(function(files) {
      var images = files.filter(function(f) {
        return f.type === 'file' && /\.png$/i.test(f.name);
      });

      if (images.length === 0) {
        statusEl.textContent = 'No cards found in "' + FRAMES_PATH + '".';
        return;
      }

      // Alphabetical, so the order is stable and predictable
      images.sort(function(a, b) { return a.name.localeCompare(b.name); });

      images.forEach(function(file) {
        var card = document.createElement('div');
        card.className = 'card';

        var img = document.createElement('img');
        img.src = file.download_url;
        img.alt = file.name;
        img.loading = 'lazy';

        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = file.name;

        var link = document.createElement('a');
        link.className = 'download';
        link.href = file.download_url;
        link.download = file.name;
        link.textContent = 'Download';

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(link);
        gridEl.appendChild(card);
      });

      statusEl.textContent = images.length + ' card' + (images.length === 1 ? '' : 's') + ' available';
    })
    .catch(function(err) {
      statusEl.textContent = 'Could not load the card list (' + err.message + '). ' +
        'Double-check the REPO/FRAMES_PATH values at the top of this page\u2019s script.';
    });
  var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightbox-img');

document.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG' && e.target.closest('.card')) {
    lightboxImg.src = e.target.src;
    lightbox.classList.add('open');
  } else if (e.target === lightbox) {
    lightbox.classList.remove('open');
  }
});
</script>

</body>
</html>
